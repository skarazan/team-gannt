<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Gantt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235271FF'/%3E%3Crect x='5' y='8' width='14' height='5' rx='2' fill='%23fff'/%3E%3Crect x='11' y='17' width='16' height='5' rx='2' fill='%23FF7A1F'/%3E%3C/svg%3E">
<style>
  :root { --ink:#0a0a1f; --line:#dcdfeb; --left:430px; --muted:#6b7090; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.3 "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:#fff; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 14px; border-bottom:2px solid #111; }
  h1 { font-size:18px; margin:0 8px 0 0; }
  .spacer { flex:1; }
  button, select, input, textarea { font:inherit; color:inherit; }
  .btn { border:2px solid #111; background:#fff; border-radius:8px; padding:5px 11px; cursor:pointer; font-weight:600; }
  .btn:hover { background:#f1f2fa; }
  .btn.primary { background:#5271FF; color:#fff; }
  .btn.primary:hover { background:#3f5ee8; }
  .btn.danger { background:#FF5757; color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:2px solid #111; border-radius:999px; padding:2px 10px 2px 6px; background:#fff; cursor:pointer; font-size:13px; font-weight:600; }
  .chip i { width:12px; height:12px; border-radius:50%; border:2px solid #111; display:inline-block; }
  .chip small { color:var(--muted); font-weight:500; }
  .chip.on { background:#111; color:#fff; } .chip.on small { color:#ccd; }
  #sync { font-size:11px; font-weight:500; color:var(--muted); margin-left:6px; }
  #scroller { flex:1; overflow:auto; position:relative; }
  #chart { position:relative; min-width:max-content; }
  .hdrwrap { position:sticky; top:0; z-index:8; background:#fff; border-bottom:2px solid #111; }
  .row { display:flex; height:38px; border-bottom:1px solid var(--line); }
  .row.h { height:26px; border-bottom:1px solid var(--line); }
  .row.group { background:#f3f4fb; font-weight:700; }
  .lcell { position:sticky; left:0; z-index:6; width:var(--left); flex:none; display:flex; align-items:center; gap:6px; padding:0 8px; border-right:2px solid #111; background:#fff; overflow:hidden; }
  .row.group .lcell { background:#f3f4fb; }
  .tcell { position:relative; flex:none; }
  .hdrwrap .lcell { color:var(--muted); font-weight:600; font-size:12px; }
  .hdr span { position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); border-left:1px solid var(--line); overflow:hidden; white-space:nowrap; }
  .hdr.m span { justify-content:flex-start; padding-left:6px; font-weight:700; color:var(--ink); font-size:12px; }
  .hdr span.we { background:rgba(20,30,80,.05); }
  .hdr span.td { background:#111; color:#fff; font-weight:700; }
  .caret { width:22px; height:22px; border:0; background:none; cursor:pointer; font-size:12px; padding:0; }
  .dot { width:14px; height:14px; border-radius:4px; border:2px solid #111; flex:none; }
  .gname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .meta { color:var(--muted); font-weight:500; font-size:12px; white-space:nowrap; }
  .mini { border:2px solid #111; background:#fff; border-radius:6px; font-size:12px; font-weight:700; padding:0 7px; height:22px; cursor:pointer; flex:none; }
  .mini:hover { background:#e9ebfb; }
  .tname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; padding-left:20px; }
  .tname:hover { text-decoration:underline; }
  .tname.done { color:var(--muted); text-decoration:line-through; }
  .asg { width:100px; flex:none; border:2px solid #111; border-radius:6px; background:#fff; height:26px; font-size:12px; padding:0 2px; }
  .bar { position:absolute; top:8px; height:22px; border:2px solid #111; border-radius:6px; cursor:grab; overflow:hidden; z-index:3; touch-action:none; user-select:none; }
  .bar:active { cursor:grabbing; }
  .bar .fill { position:absolute; inset:0 auto 0 0; background:rgba(0,0,0,.32); pointer-events:none; }
  .bar .lbl { position:absolute; inset:0; padding:0 9px; display:flex; align-items:center; color:#fff; font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-shadow:0 0 3px rgba(0,0,0,.75); pointer-events:none; }
  .bar .hl, .bar .hr { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:2; }
  .bar .hl { left:0; } .bar .hr { right:0; }
  .bar.blocked { border-color:#d11; border-style:dashed; }
  .bar.done { opacity:.7; }
  .sum { position:absolute; top:13px; height:12px; border:2px solid #111; border-radius:3px; z-index:2; pointer-events:none; }
  #today { position:absolute; top:0; bottom:0; width:2px; background:#FF5757; z-index:4; pointer-events:none; }
  .empty { padding:40px; color:var(--muted); }
  /* dialogs */
  dialog { border:2px solid #111; border-radius:12px; padding:0; width:min(480px, 94vw); box-shadow:0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(10,10,31,.4); }
  dialog form { padding:16px 18px; display:grid; gap:10px; }
  dialog h2 { margin:0 0 2px; font-size:17px; }
  label.f { display:grid; gap:3px; font-size:12px; font-weight:700; color:var(--muted); }
  label.f input, label.f select, label.f textarea { border:2px solid #111; border-radius:8px; padding:6px 8px; font-size:14px; font-weight:400; color:var(--ink); background:#fff; width:100%; }
  label.f input[type=color] { padding:2px; height:36px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .prog { display:grid; grid-template-columns:1fr 70px; gap:8px; align-items:center; }
  .prog input[type=range] { border:0; padding:0; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
  .actions .left { margin-right:auto; }
  .team-row { display:grid; grid-template-columns:1fr 54px; gap:8px; }
  .team-row input { border:2px solid #111; border-radius:8px; padding:6px 8px; font-size:14px; }
  .team-row input[type=color] { padding:2px; height:36px; }
  #main { flex:1; display:flex; min-height:0; }
  #main #scroller { min-width:0; }
  #mine { width:350px; flex:none; border-left:2px solid #111; overflow:auto; background:#fff; padding:14px; }
  #mine[hidden] { display:none; }
  #mine h3 { margin:0 0 2px; font-size:16px; display:flex; align-items:center; gap:8px; }
  #mine .sub { color:var(--muted); font-size:12px; margin-bottom:10px; }
  #mine h4 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #mine h4.od { color:#d11; }
  .mt { border:2px solid #111; border-radius:10px; padding:8px 10px; margin-bottom:8px; display:grid; grid-template-columns:22px 1fr; gap:2px 8px; background:#fff; }
  .mt.od { border-color:#d11; background:#fff5f5; }
  .mt input[type=checkbox] { width:18px; height:18px; margin:2px 0 0; cursor:pointer; accent-color:#5271FF; }
  .mt .tt { font-weight:700; cursor:pointer; overflow-wrap:anywhere; }
  .mt .tt:hover { text-decoration:underline; }
  .mt .ln { grid-column:2; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .mt .ln b { color:var(--ink); }
  .mt select { border:2px solid #111; border-radius:6px; font-size:12px; height:24px; background:#fff; }
  .mt .gd { display:inline-block; width:10px; height:10px; border-radius:3px; border:2px solid #111; vertical-align:-1px; margin-right:3px; }
  .mt.free { border-style:dashed; }
  .badge { background:#FF5757; color:#fff; border-radius:999px; font-size:11px; padding:0 6px; margin-left:4px; }
  .badge:empty { display:none; }
  .who { display:flex; align-items:center; gap:10px; width:100%; border:2px solid #111; border-radius:10px; background:#fff; padding:10px 12px; font-size:15px; font-weight:700; cursor:pointer; text-align:left; }
  .who:hover { background:#eef0ff; }
  .who i { width:16px; height:16px; border-radius:50%; border:2px solid #111; flex:none; }
  .who small { margin-left:auto; color:var(--muted); font-weight:500; font-size:12px; }
  .bar.mine { box-shadow:0 0 0 3px #FFD43B, 0 0 0 5px #111; z-index:4; }
  .rk { font:700 10px ui-monospace, Menlo, monospace; color:var(--muted); margin-right:6px; }
  .tname .star { color:#e0a800; margin-right:3px; }
  /* task dialog: two-column ticket view */
  dialog#taskDlg { width:min(1000px, 96vw); max-height:92vh; }
  #taskDlg form { padding:0; display:flex; flex-direction:column; max-height:92vh; gap:0; }
  .td-head { display:flex; align-items:flex-start; gap:10px; padding:16px 20px 12px; border-bottom:2px solid #111; }
  .td-key { flex:none; font:700 12px/1 ui-monospace, Menlo, monospace; background:#111; color:#fff; border-radius:6px; padding:6px 8px; margin-top:5px; }
  .td-key:empty { display:none; }
  #tTitle { flex:1; border:2px solid transparent; border-radius:8px; padding:4px 8px; font-family:inherit; font-size:20px; font-weight:700; line-height:1.3; resize:none; overflow:hidden; color:var(--ink); background:transparent; }
  #tTitle:hover { border-color:var(--line); } #tTitle:focus { border-color:#111; outline:none; background:#fff; }
  .td-close { flex:none; border:0; background:none; font-size:24px; line-height:1; cursor:pointer; padding:4px 6px; color:var(--muted); }
  .td-body { display:grid; grid-template-columns:minmax(0,1fr) 300px; min-height:0; flex:1; }
  .td-main { padding:16px 20px; overflow:auto; border-right:2px solid #111; min-height:320px; }
  .td-side { padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; overflow-x:hidden; align-content:start; background:#f6f7fc; overflow:auto; }
  .td-tabs { display:flex; gap:6px; margin-bottom:12px; }
  .td-tabs button { border:2px solid #111; background:#fff; border-radius:999px; padding:3px 12px; font-weight:700; font-size:13px; cursor:pointer; }
  .td-tabs button.on { background:#111; color:#fff; }
  .ticket { font-size:15px; line-height:1.55; color:var(--ink); }
  .ticket .sec { margin:0 0 16px; }
  .ticket .lab { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:2px solid #111; margin-bottom:6px; }
  .ticket .lab.goal { background:#5271FF; color:#fff; } .ticket .lab.steps { background:#FF7A1F; color:#fff; }
  .ticket .lab.done { background:#2EBD6B; color:#fff; } .ticket .lab.dep { background:#5CE1E6; } .ticket .lab.notes { background:#F2B705; }
  .ticket p { margin:2px 0 6px; }
  .ticket ol, .ticket ul { margin:2px 0 6px; padding-left:24px; }
  .ticket li { margin:3px 0; }
  .ticket ul.check { list-style:none; padding-left:4px; } .ticket ul.check li::before { content:'\2610  '; font-weight:700; }
  .ticket .tref { font:700 12px ui-monospace, Menlo, monospace; background:#eef0ff; border:1.5px solid #5271FF; color:#2b3fb8; border-radius:5px; padding:0 5px; cursor:pointer; text-decoration:none; }
  .ticket .tref:hover { background:#5271FF; color:#fff; }
  .ticket .empty { color:var(--muted); font-style:italic; }
  #tNotes { width:100%; min-height:360px; border:2px solid #111; border-radius:10px; padding:10px 12px; font:14px/1.5 ui-monospace, Menlo, Consolas, monospace; resize:vertical; }
  .td-count { font-size:11px; color:var(--muted); text-align:right; margin-top:4px; }
  .td-foot { display:flex; gap:8px; justify-content:flex-end; padding:12px 20px; border-top:2px solid #111; background:#fff; }
  .td-foot .left { margin-right:auto; }
  .td-side > *, .td-side label.f > * { min-width:0; max-width:100%; }
  .td-side select, .td-side input { width:100%; }
  .td-side .prog input[type=number] { width:100%; }
  .td-meta { font-size:12px; color:var(--muted); }
  @media (max-width:760px) { .td-body { grid-template-columns:1fr; } .td-main { border-right:0; border-bottom:2px solid #111; } }
  .st { flex:none; font-size:10px; font-weight:800; letter-spacing:.04em; border:2px solid #111; border-radius:999px; padding:1px 7px; cursor:default; white-space:nowrap; }
  .st.ready { background:#2EBD6B; color:#fff; }
  .st.wait { background:#fff; color:#111; border-style:dashed; }
  .st.done { background:#e9ebf3; color:var(--muted); border-color:#b9bdd0; }
  .bar.waiting { background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 6px, transparent 6px 12px) !important; border-style:dashed; }
  .chip.ready-chip { border-color:#2EBD6B; } .chip.ready-chip.on { background:#2EBD6B; border-color:#111; }
  .deps { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; }
  .dep { min-width:0; overflow:hidden; }
  .dep { display:flex; align-items:center; gap:6px; border:2px solid #111; border-radius:8px; padding:4px 6px; background:#fff; font-size:12px; }
  .dep .tref { flex:none; }
  .dep .dt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .dep .dt:hover { text-decoration:underline; }
  .dep .sd { flex:none; width:10px; height:10px; border-radius:50%; border:2px solid #111; }
  .dep .rm { flex:none; border:0; background:none; cursor:pointer; font-size:16px; line-height:1; color:var(--muted); padding:0 2px; }
  .dep .rm:hover { color:#d11; }
  .deps .none { font-size:12px; color:var(--muted); }
  .dephead { font-size:12px; font-weight:700; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  #tDepAdd { border:2px solid #111; border-radius:8px; padding:4px 6px; font-size:12px; background:#fff; width:100%; }
  .readyline { font-size:13px; font-weight:700; padding:8px 10px; border:2px solid #111; border-radius:10px; }
  .readyline.ready { background:#e6f8ee; } .readyline.wait { background:#fff7e0; } .readyline.done { background:#eef0f6; color:var(--muted); }
  .ticket .tref, .dep .tref { font:700 12px ui-monospace, Menlo, monospace; background:#eef0ff; border:1.5px solid #5271FF; color:#2b3fb8; border-radius:5px; padding:0 5px; cursor:pointer; }
  .mt .wt { grid-column:2; font-size:12px; color:#8a5a00; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:9px 16px; border-radius:8px; font-weight:600; display:none; z-index:50; max-width:90vw; }
</style>
</head>
<body>
<header>
  <h1>Team Gantt <span id="sync">connecting...</span></h1>
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <button class="btn" id="meBtn" title="Switch user"></button>
  <button class="btn" id="mineBtn" title="Badge = your tasks ready to start">My tasks<span class="badge" id="mineCount"></span></button>
  <select id="zoom" class="btn" title="Zoom">
    <option value="26">Days</option>
    <option value="12">Weeks</option>
    <option value="5">Months</option>
  </select>
  <button class="btn" id="todayBtn">Today</button>
  <button class="btn" id="teamBtn">Team</button>
  <button class="btn" id="exportBtn">Export</button>
  <button class="btn" id="importBtn">Import</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button class="btn" id="addGroupBtn">+ Group</button>
  <button class="btn primary" id="addTaskBtn">+ Task</button>
</header>
<div id="main"><div id="scroller"><div id="chart"></div></div><aside id="mine" hidden></aside></div>
<div id="toast"></div>

<dialog id="meDlg">
  <form onsubmit="return false">
    <h2>Who are you?</h2>
    <div style="color:var(--muted);font-size:13px">Pick your name so the board can show the tasks delegated to you. You can switch any time from the top bar.</div>
    <div id="meList" style="display:grid;gap:8px"></div>
  </form>
</dialog>

<dialog id="taskDlg">
  <form id="taskForm" onsubmit="return false">
    <div class="td-head">
      <span class="td-key" id="tKey"></span>
      <textarea id="tTitle" rows="1" required maxlength="200" placeholder="Task title"></textarea>
      <button type="button" class="td-close" id="tX" title="Close">&times;</button>
    </div>
    <div class="td-body">
      <div class="td-main">
        <div class="td-tabs"><button type="button" id="tViewBtn" class="on">Ticket</button><button type="button" id="tEditBtn">Edit notes</button></div>
        <div class="ticket" id="tView"></div>
        <div id="tEditWrap" hidden><textarea id="tNotes" maxlength="2000" placeholder="GOAL: ...&#10;STEPS:&#10;1. ...&#10;DONE WHEN:&#10;- ...&#10;DEPENDS ON: ...&#10;NOTES: ..."></textarea><div class="td-count" id="tCount"></div></div>
      </div>
      <div class="td-side">
        <label class="f">Assigned to<select id="tAsg"></select></label>
        <label class="f">Status<select id="tStatus">
          <option value="todo">To do</option><option value="doing">In progress</option>
          <option value="done">Done</option><option value="blocked">Blocked</option></select></label>
        <label class="f">Progress (%)<div class="prog"><input type="range" id="tProg" min="0" max="100" step="5"><input type="number" id="tProgN" min="0" max="100"></div></label>
        <label class="f">Start<input type="date" id="tStart" required></label>
        <label class="f">End<input type="date" id="tEnd" required></label>
        <label class="f">Group (workflow)<select id="tGroup"></select></label>
        <div class="td-meta" id="tMeta"></div>
        <div class="readyline" id="tReady"></div>
        <div><div class="dephead">Depends on (must be done first)</div><div class="deps" id="tDeps"></div>
          <select id="tDepAdd" style="margin-top:6px"></select></div>
        <div><div class="dephead">Unblocks (waiting on this)</div><div class="deps" id="tUnblocks"></div></div>
      </div>
    </div>
    <div class="td-foot">
      <button type="button" class="btn danger left" id="tDelete">Delete</button>
      <button type="button" class="btn" id="tCancel">Cancel</button>
      <button type="button" class="btn primary" id="tSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="groupDlg">
  <form onsubmit="return false">
    <h2 id="groupDlgTitle">Group</h2>
    <label class="f">Name<input id="gName" maxlength="80"></label>
    <label class="f">Color<input type="color" id="gColor"></label>
    <div class="actions">
      <button type="button" class="btn danger left" id="gDelete">Delete group</button>
      <button type="button" class="btn" id="gCancel">Cancel</button>
      <button type="button" class="btn primary" id="gSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="teamDlg">
  <form onsubmit="return false">
    <h2>Team members</h2>
    <div id="teamRows" style="display:grid;gap:8px"></div>
    <div class="actions">
      <button type="button" class="btn" id="mCancel">Cancel</button>
      <button type="button" class="btn primary" id="mSave">Save</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const toDay = (s) => Math.floor(Date.parse(s + 'T00:00:00Z') / 864e5);
const fromDay = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const fmt = (n) => { const d = new Date(n * 864e5); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate(); };
const todayDay = () => { const d = new Date(); return toDay(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); };
const LEFTW = 430, GREY = '#b9bdd0';

let S = { rev: 0, members: [], groups: [], tasks: [] };
let R = { start: 0, days: 0 };
const ui = {
  dayW: +(localStorage.getItem('gantt.zoom') || 26),
  filter: null,
  collapsed: new Set(JSON.parse(localStorage.getItem('gantt.collapsed') || '[]')),
};
ui.me = localStorage.getItem('gantt.me');
ui.mineOpen = localStorage.getItem('gantt.mine') === '1';
ui.readyOnly = false;
let drag = null;

// ---------------------------------------------------------------- api
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
async function mutate(method, url, body) {
  try { S = await api(method, url, body); setSync(true); }
  catch (e) { toast(e.message); try { S = await api('GET', '/api/state'); } catch {} }
  render();
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3500); }
function setSync(ok) { $('#sync').textContent = ok ? 'synced' : 'offline - retrying'; }

// ---------------------------------------------------------------- helpers
const member = (id) => S.members.find((m) => m.id === id);
const me = () => member(ui.me);
const taskById = (id) => S.tasks.find((t) => t.id === id);
const depsOf = (t) => (t.deps || []).map(taskById).filter(Boolean);
const blockersOf = (t) => depsOf(t).filter((d) => d.status !== 'done');
const isReady = (t) => t.status !== 'done' && !blockersOf(t).length;

function visibleTasks(gid) {
  return S.tasks.filter((t) => t.groupId === gid && (!ui.readyOnly || isReady(t)) && (ui.filter === null || (ui.filter === 'none' ? !t.assigneeId : t.assigneeId === ui.filter)));
}

// ---------------------------------------------------------------- render
function renderChips() {

  let h = `<span class="chip ${ui.filter === null && !ui.readyOnly ? 'on' : ''}" data-f="all">All</span>`;
  for (const m of S.members) h += `<span class="chip ${ui.filter === m.id ? 'on' : ''}" data-f="${m.id}"><i style="background:${m.color}"></i>${esc(m.name)}${m.id === ui.me ? ' (you)' : ''} <small>${open(m.id)}</small></span>`;
  h += `<span class="chip ${ui.filter === 'none' ? 'on' : ''}" data-f="none"><i style="background:${GREY}"></i>Unassigned <small>${open('none')}</small></span>`;
  const nReady = S.tasks.filter(isReady).length;
  h = `<span class="chip ready-chip ${ui.readyOnly ? 'on' : ''}" data-f="ready" title="Tasks whose dependencies are all done">&#9654; Ready now <small>${nReady}</small></span>` + h;

}

function render() {
  renderChips(); renderMe(); renderMine();
  const dw = ui.dayW, today = todayDay();
  let mn = today, mx = today + 49;
  for (const t of S.tasks) { mn = Math.min(mn, toDay(t.start)); mx = Math.max(mx, toDay(t.end)); }
  mn -= 7; mn -= (((mn + 3) % 7) + 7) % 7; mx += 14;     // align start to a Monday
  R = { start: mn, days: mx - mn + 1 };
  const W = R.days * dw;

  // header: months + days/weeks
  let months = '', cur = null;
  for (let i = 0; i < R.days; i++) {
    const d = new Date((mn + i) * 864e5), key = d.getUTCFullYear() * 12 + d.getUTCMonth();
    if (!cur || cur.key !== key) { if (cur) months += mSpan(cur, dw); cur = { key, i, n: 0, label: MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear() }; }
    cur.n++;
  }
  months += mSpan(cur, dw);
  let days = '';
  if (dw >= 20) {
    for (let i = 0; i < R.days; i++) {
      const n = mn + i, wd = (n + 3) % 7;
      days += `<span class="${n === today ? 'td' : wd >= 5 ? 'we' : ''}" style="left:${i * dw}px;width:${dw}px">${new Date(n * 864e5).getUTCDate()}</span>`;
    }
  } else {
    for (let i = 0; i < R.days; i += 7) days += `<span style="left:${i * dw}px;width:${7 * dw}px">${fmt(mn + i)}</span>`;
  }
  const grid = dw >= 10
    ? `repeating-linear-gradient(to right,transparent 0,transparent ${5 * dw}px,rgba(20,30,80,.055) ${5 * dw}px,rgba(20,30,80,.055) ${7 * dw}px),repeating-linear-gradient(to right,#cdd0e2 0,#cdd0e2 1px,transparent 1px,transparent ${7 * dw}px)`
    : `repeating-linear-gradient(to right,#cdd0e2 0,#cdd0e2 1px,transparent 1px,transparent ${7 * dw}px)`;

  let h = `<div class="hdrwrap">
    <div class="row h"><div class="lcell">Workflow / task</div><div class="tcell hdr m" style="width:${W}px">${months}</div></div>
    <div class="row h"><div class="lcell">Assigned to</div><div class="tcell hdr" style="width:${W}px">${days}</div></div></div>`;

  let shown = 0;
  for (const g of S.groups) {
    const all = S.tasks.filter((t) => t.groupId === g.id), vis = visibleTasks(g.id);
    if ((ui.filter !== null || ui.readyOnly) && !vis.length) continue;
    shown++;
    const closed = ui.collapsed.has(g.id);
    const doneN = all.filter((t) => t.status === 'done').length;
    const pct = all.length ? Math.round(all.reduce((a, t) => a + t.progress, 0) / all.length) : 0;
    let sum = '';
    if (vis.length) {
      const s = Math.min(...vis.map((t) => toDay(t.start))), e = Math.max(...vis.map((t) => toDay(t.end)));
      sum = `<div class="sum" style="left:${(s - mn) * dw}px;width:${(e - s + 1) * dw}px;background:${esc(g.color)}"></div>`;
    }
    h += `<div class="row group"><div class="lcell">
        <button class="caret" data-act="toggle" data-id="${g.id}">${closed ? '&#9654;' : '&#9660;'}</button>
        <span class="dot" style="background:${esc(g.color)}"></span>
        <span class="gname" data-act="editGroup" data-id="${g.id}" title="Edit group">${esc(g.name)}</span>
        <span class="meta">${doneN}/${all.length} done &middot; ${pct}%</span>
        <span style="flex:1"></span>
        <button class="mini" data-act="addTask" data-id="${g.id}" title="Add task to this group">+ task</button>
      </div><div class="tcell" style="width:${W}px;background-image:${grid}">${sum}</div></div>`;
    if (closed) continue;
    for (const t of vis) {
      const s = toDay(t.start), e = toDay(t.end), left = (s - mn) * dw, w = (e - s + 1) * dw;
      const opts = `<option value="">Unassigned</option>` + S.members.map((m) => `<option value="${m.id}" ${m.id === t.assigneeId ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
      const label = (t.status === 'done' ? '&#10003; ' : '') + esc(t.title);
      h += `<div class="row"><div class="lcell">
          <span class="tname ${t.status === 'done' ? 'done' : ''}" data-act="editTask" data-id="${t.id}" title="${esc(t.title)}">${t.assigneeId && t.assigneeId === ui.me ? '<span class="star">&#9733;</span>' : ''}${taskKey(t) ? '<span class="rk">' + taskKey(t) + '</span>' : ''}${esc(t.title)}</span>
          ${stBadge(t)}
          <select class="asg" data-id="${t.id}" title="Delegate">${opts}</select>
        </div><div class="tcell" style="width:${W}px;background-image:${grid}">
          <div class="bar ${t.status}${t.status !== 'done' && blockersOf(t).length ? ' waiting' : ''}${t.assigneeId && t.assigneeId === ui.me ? ' mine' : ''}" data-tid="${t.id}" style="left:${left}px;width:${w}px;background:${colorOf(t)}" title="${esc(t.title)} (${fmt(s)} - ${fmt(e)}, ${t.progress}%)${blockersOf(t).length && t.status !== 'done' ? '\nWaiting on ' + esc(blockersOf(t).map(keyOrTitle).join(', ')) : ''}">
            <div class="fill" style="width:${t.progress}%"></div><div class="lbl">${w > 70 ? label : ''}</div><div class="hl"></div><div class="hr"></div>
          </div></div></div>`;
    }
  }
  if (!shown) h += `<div class="empty">${S.groups.length ? 'No tasks match this filter.' : 'No groups yet. Click "+ Group" to create your first workflow.'}</div>`;
  h += `<div id="today" style="left:${LEFTW + (today - mn) * dw + dw / 2}px"></div>`;
  $('#chart').innerHTML = h;
}
function stBadge(t) {
  if (t.status === 'done') return '<span class="st done">DONE</span>';
  const b = blockersOf(t);
  if (!b.length) return '<span class="st ready" title="All dependencies done: you can start this">READY</span>';
  return `<span class="st wait" title="Waiting on: ${esc(b.map((d) => keyOrTitle(d) + ' ' + d.title + ' (' + ((member(d.assigneeId) || {}).name || 'unassigned') + ')').join('\n'))}">WAITS ${b.length}</span>`;
}
function mSpan(c, dw) { return `<span style="left:${c.i * dw}px;width:${c.n * dw}px">${c.n * dw > 60 ? c.label : ''}</span>`; }

chart.addEventListener('pointerdown', (e) => {

  const mode = e.target.classList.contains('hl') ? 'l' : e.target.classList.contains('hr') ? 'r' : 'm';
  drag = { t, bar, mode, x0: e.clientX, s: toDay(t.start), e: toDay(t.end), ns: toDay(t.start), ne: toDay(t.end), moved: false };
  bar.setPointerCapture(e.pointerId); e.preventDefault();

chart.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x0; if (Math.abs(dx) > 3) drag.moved = true;
  const dd = Math.round(dx / ui.dayW);
  let s = drag.s, en = drag.e;
  if (drag.mode === 'm') { s += dd; en += dd; } else if (drag.mode === 'l') s = Math.min(s + dd, en); else en = Math.max(en + dd, s);
  drag.ns = s; drag.ne = en;
  drag.bar.style.left = (s - R.start) * ui.dayW + 'px';
  drag.bar.style.width = (en - s + 1) * ui.dayW + 'px';
  drag.bar.title = `${drag.t.title} (${fmt(s)} - ${fmt(en)})`;
});
chart.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { openTask(d.t.id); return; }
  if (d.ns === d.s && d.ne === d.e) { render(); return; }
  d.t.start = fromDay(d.ns); d.t.end = fromDay(d.ne); render();      // optimistic
  mutate('PATCH', '/api/tasks/' + d.t.id, { start: d.t.start, end: d.t.end });

// ---------------------------------------------------------------- task dialog
let editing = null, editDeps = [];
function openTask(id, gid) {
  const t = id ? S.tasks.find((x) => x.id === id) : null; editing = t;
  if (!t && !S.groups.length) return toast('Create a group first');
  $('#tGroup').innerHTML = S.groups.map((g) => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  $('#tAsg').innerHTML = `<option value="">Unassigned</option>` + S.members.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  const td = todayDay();
  $('#tTitle').value = t ? t.title : '';
  $('#tGroup').value = t ? t.groupId : gid || S.groups[0].id;
  $('#tAsg').value = t ? t.assigneeId || '' : '';
  $('#tStart').value = t ? t.start : fromDay(td);
  $('#tEnd').value = t ? t.end : fromDay(td + 4);
  $('#tStatus').value = t ? t.status : 'todo';
  $('#tProg').value = $('#tProgN').value = t ? t.progress : 0;
  $('#tNotes').value = t ? t.notes : '';
  $('#tKey').textContent = t ? taskKey(t) : '';
  editDeps = t ? [...(t.deps || [])] : [];
  renderDeps();
  $('#tDelete').style.display = t ? '' : 'none';
  setNotesMode(t && t.notes ? 'view' : 'edit');
  updateMeta();
  $('#taskDlg').showModal(); fitTitle();
  if (!t) $('#tTitle').focus(); else $('#tTitle').blur();
  $('#taskDlg .td-main').scrollTop = 0;
}
const taskKey = (t) => { const m = /^t_(t\d{3,})$/i.exec(t.id); return m ? m[1].toUpperCase() : ''; };
const byKey = (k) => S.tasks.find((t) => taskKey(t) === k.toUpperCase());
function depRow(d, removable) {
  return `<div class="dep"><span class="sd" style="background:${SDOT[d.status]}" title="${d.status}"></span>${taskKey(d) ? `<a class="tref" data-open="${d.id}">${taskKey(d)}</a>` : ''}<span class="dt" data-open="${d.id}" title="${esc(d.title)}">${esc(d.title)}</span>${removable ? `<button type="button" class="rm" data-rm="${d.id}" title="Remove dependency">&times;</button>` : ''}</div>`;
}
function wouldLoop(id, depId) {
  if (!id) return false;
  const seen = new Set(), stack = [depId];
  while (stack.length) { const c = stack.pop(); if (c === id) return true; if (seen.has(c)) continue; seen.add(c); const t = taskById(c); if (t) stack.push(...(t.deps || [])); }
  return false;
}
function renderDeps() {
  const self = editing;
  const ds = editDeps.map(taskById).filter(Boolean);
  $('#tDeps').innerHTML = ds.length ? ds.map((d) => depRow(d, true)).join('') : '<div class="none">None, can start any time.</div>';
  const ub = self ? unblocksOf(self) : [];
  $('#tUnblocks').innerHTML = ub.length ? ub.map((d) => depRow(d, false)).join('') : '<div class="none">Nothing.</div>';
  const blockers = ds.filter((d) => d.status !== 'done');
  const st = $('#tStatus').value, rl = $('#tReady');
  if (st === 'done') { rl.className = 'readyline done'; rl.textContent = 'Done'; }
  else if (!blockers.length) { rl.className = 'readyline ready'; rl.textContent = '▶ Ready: you can start this now'; }
  else { rl.className = 'readyline wait'; rl.textContent = '⏳ Waiting on ' + blockers.length + ': ' + blockers.map((d) => keyOrTitle(d) + ' (' + ((member(d.assigneeId) || {}).name || 'unassigned') + ')').join(', '); }
  const opts = S.tasks.filter((x) => (!self || x.id !== self.id) && !editDeps.includes(x.id) && !wouldLoop(self && self.id, x.id))
    .sort((a, b) => a.start.localeCompare(b.start));
  $('#tDepAdd').innerHTML = '<option value="">+ Add a dependency…</option>' + opts.map((x) => `<option value="${x.id}">${taskKey(x) ? taskKey(x) + ' · ' : ''}${esc(x.title.slice(0, 70))}</option>`).join('');
  if (!$('#tView').hidden) $('#tView').innerHTML = renderTicket($('#tNotes').value);
}

$('#taskDlg').addEventListener('click', (e) => {
  const rm = e.target.closest('[data-rm]'); if (rm) { editDeps = editDeps.filter((x) => x !== rm.dataset.rm); renderDeps(); return; }
  const op = e.target.closest('[data-open]'); if (op) openTask(op.dataset.open);
});

function updateMeta() {

function setNotesMode(mode) {

  $('#tView').hidden = edit; $('#tEditWrap').hidden = !edit;

$('#tEditBtn').onclick = () => { setNotesMode('edit'); $('#tNotes').focus(); };
$('#tX').onclick = () => $('#taskDlg').close();
const LABELS = { 'GOAL': 'goal', 'STEPS': 'steps', 'DONE WHEN': 'done', 'DEPENDS ON': 'dep', 'NOTES': 'notes' };
function linkify(html) {
  return html.replace(/\b(T\d{3,})\b/g, (m) => byKey(m) ? `<a class="tref" data-key="${m}" title="${esc(byKey(m).title)}">${m}</a>` : m);
}
function renderTicket(text) {
  if (!text.trim()) return '<p class="empty">No notes yet. Click "Edit notes" to add the ticket.</p>';
  const secs = []; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const m = /^\s*(GOAL|STEPS|DONE WHEN|DEPENDS ON|NOTES)\s*:\s*(.*)$/i.exec(raw);
    if (m) { cur = { label: m[1].toUpperCase(), lines: [] }; secs.push(cur); if (m[2].trim()) cur.lines.push(m[2]); }
    else { if (!cur) { cur = { label: null, lines: [] }; secs.push(cur); } cur.lines.push(raw); }
  }
  const depSecIdx = secs.findIndex((x) => x.label === 'DEPENDS ON');
  const depHtml = (() => { const ds = editDeps.map(taskById).filter(Boolean);
    return `<div class="sec"><span class="lab dep">Depends on</span>${ds.length ? '<ul>' + ds.map((d) => `<li><a class="tref" data-open="${d.id}">${esc(keyOrTitle(d))}</a> ${esc(d.title)} <b style="color:${d.status === 'done' ? '#1d8a4c' : '#8a5a00'}">(${d.status === 'done' ? 'done' : (member(d.assigneeId) || {}).name || 'unassigned'})</b></li>`).join('') + '</ul>' : '<p class="empty">None, can start any time.</p>'}</div>`; })();
  if (depSecIdx >= 0) secs[depSecIdx] = { html: depHtml };
  else { const ni = secs.findIndex((x) => x.label === 'NOTES'); secs.splice(ni >= 0 ? ni : secs.length, 0, { html: depHtml }); }
  return secs.map((sec) => {
    if (sec.html) return sec.html;
    let h = '', list = null;
    const close = () => { if (list) { h += `</${list.tag}>`; list = null; } };
    for (const line of sec.lines) {
      const l = line.trim(); if (!l) { close(); continue; }
      const num = /^\d+[.)]\s+(.*)$/.exec(l), bul = /^[-*\u2022]\s+(.*)$/.exec(l);
      if (num || bul) {
        const tag = num ? 'ol' : 'ul', cls = bul && sec.label === 'DONE WHEN' ? ' class="check"' : '';
        if (!list || list.tag !== tag) { close(); h += `<${tag}${cls}>`; list = { tag }; }
        h += `<li>${linkify(esc((num || bul)[1]))}</li>`;
      } else { close(); h += `<p>${linkify(esc(l))}</p>`; }
    }
    close();
    const lab = sec.label ? `<span class="lab ${LABELS[sec.label]}">${sec.label === 'DONE WHEN' ? 'Done when' : sec.label === 'DEPENDS ON' ? 'Depends on' : sec.label[0] + sec.label.slice(1).toLowerCase()}</span>` : '';
    return `<div class="sec">${lab}${h}</div>`;
  }).join('');
}

$('#gCancel').onclick = () => $('#groupDlg').close();
$('#gSave').onclick = async () => {
  const name = $('#gName').value.trim(); if (!name) return toast('Name is required');
  $('#groupDlg').close();
  const body = { name, color: $('#gColor').value };
  await (editingGroup ? mutate('PATCH', '/api/groups/' + editingGroup.id, body) : mutate('POST', '/api/groups', body));
};
$('#gDelete').onclick = async () => {
  const n = S.tasks.filter((t) => t.groupId === editingGroup.id).length;
  if (!confirm(`Delete "${editingGroup.name}"${n ? ' and its ' + n + ' task(s)' : ''}?`)) return;
  $('#groupDlg').close(); await mutate('DELETE', '/api/groups/' + editingGroup.id);
};

// ---------------------------------------------------------------- team dialog
function openTeam() {
  $('#teamRows').innerHTML = S.members.map((m) => `<div class="team-row"><input data-id="${m.id}" class="mn" value="${esc(m.name)}" maxlength="40"><input type="color" data-id="${m.id}" class="mc" value="${m.color}"></div>`).join('');
  $('#teamDlg').showModal();
}
$('#mCancel').onclick = () => $('#teamDlg').close();
$('#mSave').onclick = async () => {
  const members = S.members.map((m) => ({
    id: m.id,
    name: document.querySelector(`.mn[data-id="${m.id}"]`).value,
    color: document.querySelector(`.mc[data-id="${m.id}"]`).value,
  }));
  $('#teamDlg').close(); await mutate('PATCH', '/api/members', { members });
};

// ---------------------------------------------------------------- identity + my tasks
function renderMe() {
  const m = me();
  $('#meBtn').innerHTML = m ? `<span class="dot" style="background:${m.color};display:inline-block;vertical-align:-2px;margin-right:6px"></span>${esc(m.name)} (you)` : 'Who are you?';
  const n = m ? S.tasks.filter((t) => t.assigneeId === m.id && isReady(t)).length : 0;
  $('#mineCount').textContent = n ? n : '';
  $('#mineBtn').classList.toggle('primary', ui.mineOpen);
}
function openMe() {
  $('#meList').innerHTML = S.members.map((m) => `<button type="button" class="who" data-id="${m.id}"><i style="background:${m.color}"></i>${esc(m.name)}<small>${openCount(m.id)} open</small></button>`).join('');
  $('#meDlg').showModal();
}
$('#meBtn').onclick = openMe;
$('#meList').addEventListener('click', (e) => {
  const b = e.target.closest('.who'); if (!b) return;
  const first = !me();
  ui.me = b.dataset.id; localStorage.setItem('gantt.me', ui.me);
  if (first) { ui.mineOpen = true; localStorage.setItem('gantt.mine', '1'); }
  $('#meDlg').close(); render();
});
$('#meDlg').addEventListener('cancel', (e) => { if (!me()) e.preventDefault(); });
$('#mineBtn').onclick = () => { ui.mineOpen = !ui.mineOpen; localStorage.setItem('gantt.mine', ui.mineOpen ? '1' : '0'); render(); };

function dueLabel(t, td) {
  const e = toDay(t.end), s = toDay(t.start);
  if (e < td) return `<b style="color:#d11">overdue by ${td - e}d</b>`;
  if (s > td) return `starts in ${s - td}d`;
  const left = e - td; return left === 0 ? '<b>due today</b>' : `due in ${left}d`;
}
function mineCard(t, td, od) {
  const g = S.groups.find((x) => x.id === t.groupId) || { name: '', color: GREY };
  return `<div class="mt ${od ? 'od' : ''}"><input type="checkbox" data-act="chk" data-id="${t.id}" ${t.status === 'done' ? 'checked' : ''} title="Mark done">
    <div class="tt" data-act="open" data-id="${t.id}">${taskKey(t) ? '<span class="rk">' + taskKey(t) + '</span>' : ''}${esc(t.title)}</div>
    ${t.status !== 'done' && blockersOf(t).length ? '<div class="wt">Waiting on ' + blockersOf(t).map((d) => `<a class="tref" data-act="open" data-id="${d.id}">${esc(keyOrTitle(d))}</a> (${esc((member(d.assigneeId) || {}).name || 'unassigned')})`).join(', ') + '</div>' : ''}
    <div class="ln"><span><i class="gd" style="background:${esc(g.color)}"></i>${esc(g.name)}</span><span>${fmt(toDay(t.start))} - ${fmt(toDay(t.end))}</span>${t.status === 'done' ? '' : '<span>' + dueLabel(t, td) + '</span>'}</div>
    <div class="ln"><select data-act="st" data-id="${t.id}">${[['todo','To do'],['doing','In progress'],['done','Done'],['blocked','Blocked']].map(([v,l]) => `<option value="${v}" ${t.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span>${t.progress}%</span></div></div>`;
}
function renderMine() {
  const el = $('#mine'); el.hidden = !ui.mineOpen; if (!ui.mineOpen) return;
  const m = me(); if (!m) { el.innerHTML = '<p>Pick who you are first.</p>'; return; }
  const td = todayDay();
  const mine = S.tasks.filter((t) => t.assigneeId === m.id);
  const open = mine.filter((t) => t.status !== 'done').sort((a, b) => a.end.localeCompare(b.end) || a.start.localeCompare(b.start));
  const ready = open.filter(isReady), waiting = open.filter((t) => !isReady(t));
  const over = open.filter((t) => toDay(t.end) < td);
  const done = mine.filter((t) => t.status === 'done');
  const free = S.tasks.filter((t) => !t.assigneeId && t.status !== 'done').sort((a, b) => isReady(b) - isReady(a));
  let h = `<h3><span class="dot" style="background:${m.color}"></span>${esc(m.name)}'s tasks</h3>
    <div class="sub"><b style="color:#1d8a4c">${ready.length} ready to start</b> &middot; ${waiting.length} waiting &middot; ${done.length} done${over.length ? ' &middot; <b style="color:#d11">' + over.length + ' overdue</b>' : ''}</div>`;
  if (!mine.length) h += '<p style="color:var(--muted)">Nothing is delegated to you yet. Someone can assign you a task from its dropdown, or take an unassigned one below.</p>';
  if (ready.length) h += '<h4 style="color:#1d8a4c">Ready to start now</h4>' + ready.map((t) => mineCard(t, td, toDay(t.end) < td)).join('');
  if (waiting.length) h += '<h4>Waiting on others</h4>' + waiting.map((t) => mineCard(t, td, toDay(t.end) < td)).join('');
  if (done.length) h += '<h4>Done</h4>' + done.map((t) => mineCard(t, td, false)).join('');
  if (free.length) {
    h += `<h4>Unassigned (${free.length})</h4>` + free.map((t) => `<div class="mt free"><span></span><div class="tt" data-act="open" data-id="${t.id}">${esc(t.title)}</div>
      <div class="ln"><span>${fmt(toDay(t.start))} - ${fmt(toDay(t.end))}</span><button class="mini" data-act="take" data-id="${t.id}">Take it</button></div></div>`).join('');
  }
  el.innerHTML = h;
}
$('#mine').addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a || a.tagName === 'SELECT' || a.type === 'checkbox') return;
  if (a.dataset.act === 'open') openTask(a.dataset.id);
  else if (a.dataset.act === 'take') mutate('PATCH', '/api/tasks/' + a.dataset.id, { assigneeId: ui.me });
});
$('#mine').addEventListener('change', (e) => {
  const a = e.target, id = a.dataset.id; if (!id) return;
  const t = S.tasks.find((x) => x.id === id); if (!t) return;
  if (a.dataset.act === 'chk') mutate('PATCH', '/api/tasks/' + id, a.checked ? { status: 'done', progress: 100 } : { status: t.progress > 0 ? 'doing' : 'todo' });
  else if (a.dataset.act === 'st') mutate('PATCH', '/api/tasks/' + id, a.value === 'done' ? { status: 'done', progress: 100 } : { status: a.value });
});

// ---------------------------------------------------------------- live sync (shared board)
async function poll() {
  if (drag || document.hidden || document.querySelector('dialog[open]')) return;
  try {
    const r = await api('GET', '/api/state?rev=' + S.rev);
    setSync(true);
    if (!r.unchanged) {
      const had = new Set(S.tasks.filter((t) => t.assigneeId === ui.me).map((t) => t.id));
      const wasReady = new Set(S.tasks.filter((t) => t.assigneeId === ui.me && isReady(t)).map((t) => t.id));
      S = r;
      const fresh = S.tasks.filter((t) => ui.me && t.assigneeId === ui.me && !had.has(t.id));
      render();
      const nowReady = S.tasks.filter((t) => t.assigneeId === ui.me && had.has(t.id) && isReady(t) && !wasReady.has(t.id));
      if (fresh.length) toast('Newly assigned to you: ' + fresh.map((t) => t.title).join(', '));
      else if (nowReady.length) toast('Unblocked, ready to start: ' + nowReady.map((t) => keyOrTitle(t) + ' ' + t.title).join(', '));
    }
  } catch { setSync(false); }
}
setInterval(poll, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

(async () => {
  try { S = await api('GET', '/api/state'); setSync(true); } catch (e) { setSync(false); toast('Could not load the board'); }
  render(); scrollToToday();
  if (!me() && S.members.length) openMe();
})();
</script>
</body>
</html>
